# ZenTomato — XcodeGen project definition.
#
# THIS FILE IS THE PROJECT. `ZenTomato.xcodeproj` is generated from it by
# `make generate` and is git-ignored, so this YAML is the only reviewable
# description of how the app is built. Four reasons that trade is right here:
#
#   1. The brief mandates XcodeGen and forbids committing a binary project.
#   2. Two engineers share one working tree; a committed `.pbxproj` is a
#      guaranteed merge-corruption source.
#   3. The owner reviews every pull request and does not write Swift. A
#      `.pbxproj` diff is unreadable to anyone; this YAML is not.
#   4. CI regenerates from this file on every run, which proves this file
#      actually builds. A committed project proves nothing about this file.
#
# Cost: a fresh clone must run `make generate` before opening Xcode. That is
# one line in the README.

name: ZenTomato

options:
  bundleIdPrefix: com.martingleason
  deploymentTarget: { iOS: "26.0" }
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 6 language mode with the strictest data-race checking the compiler
    # offers. Turning this on now is cheap; turning it on after the timer
    # engine and audio callbacks exist would be a rewrite.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The lint gate is `swiftlint --strict`, not the compiler. A future SDK
    # deprecation warning must not be able to break the build gate.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    CODE_SIGN_STYLE: Automatic
    # Supplied by Config/App.xcconfig, overridden by the git-ignored
    # Config/Secrets.xcconfig. May legitimately be empty: simulator builds are
    # made with code signing disabled entirely, and only a device install needs
    # a team.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:

  ZenTomato:
    type: application
    platform: iOS
    # A DIRECTORY GLOB, never a per-file list. Adding a Swift file must not
    # require editing this file, or the two would drift.
    sources:
      - path: ZenTomato
    # The Live Activity lives in its own bundle inside the app. Listing it here
    # is what makes Xcode build it and embed it in the app's PlugIns folder.
    # WITHOUT THIS LINE THE EXTENSION COMPILES AND IS NEVER INSTALLED, which
    # presents as "the Live Activity simply does not appear" with no error
    # anywhere — no crash, no warning, nothing in the log. It is one of the three
    # silent ways this feature can look broken; the other two are the
    # NSSupportsLiveActivities key below and a mismatch between the two
    # processes' idea of what travels with an alarm.
    dependencies:
      - target: ZenTomatoActivity
    # Xcode's own configuration mechanism, and the only one this project uses.
    # App.xcconfig is committed and holds safe defaults; it ends by optionally
    # including the git-ignored Config/Secrets.xcconfig, which is where a real
    # credential lives. See Config/App.xcconfig for how a value reaches the app.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      # Also generated and git-ignored, so the Info.plist keys below are
      # reviewed as YAML here rather than as XML in a second file. It lives in
      # Support/, deliberately OUTSIDE the ZenTomato/ source glob, so XcodeGen
      # cannot mistake it for a bundled resource.
      path: Support/ZenTomato-Info.plist
      properties:
        CFBundleDisplayName: ZenTomato
        # These two must be written here, referring to the build settings
        # below, or they do not reach the app at all. XcodeGen fills an
        # unlisted key with its own default — which for the version is the
        # literal string "1.0" — so setting MARKETING_VERSION alone left the
        # app reporting itself as version 1.0 while this file said 0.1.0. That
        # is exactly the drift the "one reviewable source of truth" argument at
        # the top of this file exists to prevent, and version numbers stop
        # being cosmetic the moment two builds are installed on one phone.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without a launch-screen declaration the app letterboxes on a modern
        # iPhone, so this key must be present.
        #
        # It names the colour of the blank screen iOS shows between the tap on
        # the icon and the app's first frame. Left empty that screen is pure
        # white (or pure black), which flashes
        # against this app's warm stone page on every single launch. Naming a
        # colour here makes the launch screen the same colour as the page, so
        # there is nothing to see.
        #
        # LaunchBackground must stay equal to ColorRole.surfacePrimary. Nothing in
        # the compiler can enforce that — an asset catalog is data, not code — so
        # a test decodes this colour set and compares it against the role. If you
        # change one, that test tells you to change the other.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait only. This is one glanceable single-column screen; shipping
        # landscape would ship a layout nobody designed or tested.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Avoids an export-compliance prompt every time a build is installed.
        ITSAppUsesNonExemptEncryption: false
        # Required by ActivityKit. AlarmKit's countdown alarms present through a
        # Live Activity, so without this key the alarm is scheduled and nothing
        # is ever drawn on the Lock Screen. Silent when missing.
        NSSupportsLiveActivities: true
        # The sentence iOS shows in the permission prompt the first time somebody
        # taps Start. A framework that asks for a permission expects the app to
        # explain why in its own words, and iOS refuses the request outright if
        # the explanation is missing — which would present as "alarms are always
        # denied". Confirm the exact wording of the switch this maps to on the
        # device before shipping; the explainer screen names it in its copy.
        NSAlarmKitUsageDescription: >-
          ZenTomato sets an alarm for the end of each focus block and each break,
          so a block can end while your phone is silent or in a Focus.
        # THE TWO KEYS BELOW ARRIVE WITH F4 AND NOT BEFORE.
        # F2's scope fence forbade both of them by name, because a background
        # mode and a music permission string in a timer that plays nothing are
        # capabilities claimed for work that has not been done. F4 is the
        # feature that legitimately needs them — see docs/plans/00-deltas.md,
        # D19 — and this is where they land.
        #
        # Without this, iOS suspends the app a few seconds after the screen
        # locks and the music simply stops. It presents as "music works until I
        # put the phone down": no crash, no warning, nothing in the log. It is
        # the key the spec's "verify background audio at build time" clause is
        # pointing at, and the verification is the device check on a real phone
        # rather than this line.
        UIBackgroundModes:
          - audio
        # The sentence iOS shows the first time somebody switches music on.
        # MusicKit refuses the permission request outright when it is missing,
        # which presents as "music permission is always denied" with no
        # explanation anywhere — the same silent failure NSAlarmKitUsageDescription
        # above exists to prevent for alarms.
        #
        # The wording is true of what this feature does and of nothing more: it
        # says the library is read, it says nothing in it is ever changed, and
        # it names the pause-on-break behaviour, so a person reading the prompt
        # learns what they are agreeing to.
        NSAppleMusicUsageDescription: >-
          ZenTomato plays a playlist or song from your Apple Music library during
          focus blocks and pauses it during breaks. It only reads your library
          and never changes anything in it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martingleason.ZenTomato
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 = iPhone. No iPad layout exists.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # The Live Activity: the countdown on the Lock Screen and in the Dynamic
  # Island. It is a separate bundle because iOS requires one — those two surfaces
  # are drawn by a different process from the app, and that process cannot open
  # the app's database. Everything the Lock Screen shows therefore travels inside
  # the alarm's own data; see ZenTomato/Shared/FocusAlarmMetadata.swift.
  ZenTomatoActivity:
    type: app-extension
    platform: iOS
    sources:
      # The extension's own views.
      - path: ZenTomatoActivity
      # COMPILED INTO BOTH BUNDLES. Two targets may list the same directory, and
      # that is the right answer here rather than copying the files or inventing
      # a package:
      #
      #   * Copying is how you ship a blank Lock Screen. The data that crosses
      #     between the two processes has to be written down the same way on both
      #     sides, and two copies of a description drift.
      #   * A package would be a new build system inside the build system, and
      #     the project forbids a new dependency without a spec change.
      #
      # Each target compiles its own copy of these few small files into its own
      # module. The cost is a second compile of about a dozen files. The rule
      # that comes with it, and the one to police in review: NOTHING that touches
      # the database, the alarm framework's manager, or the timer engine may be
      # put in either of these directories. An extension that can see the
      # database is an extension that will one day try to open it.
      - path: ZenTomato/Shared
      - path: ZenTomato/DesignSystem
      # One file, not the whole Timer directory. The names of the three kinds of
      # block are drawn on the Lock Screen, and if the widget spelled them itself
      # the two could disagree — a disagreement only ever visible on a locked
      # phone, which is the hardest possible place to notice one.
      - path: ZenTomato/Timer/BlockKind.swift
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      # Generated, git-ignored, and reviewed here as YAML rather than as XML in a
      # second file — the same arrangement the app target uses.
      path: Support/ZenTomatoActivity-Info.plist
      properties:
        CFBundleDisplayName: ZenTomato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # This is the whole of what makes the bundle a widget extension. The
        # identifier is Apple's, not ours, and it must be exact.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # A child of the app's identifier. iOS requires an extension's bundle id
        # to be prefixed by its container app's, and the existing wildcard
        # provisioning profile covers it, so no new profile is needed to install
        # on a phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.martingleason.ZenTomato.Activity
        # Kept in step with the app deliberately: two bundles installed together
        # with different versions is a support question nobody wants.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 = iPhone.
        TARGETED_DEVICE_FAMILY: "1"
        # An extension is installed by its container app, never on its own.
        SKIP_INSTALL: "YES"
        # Marks this build as the widget's copy of the shared sources.
        #
        # One file — ZenTomato/Shared/DismissBlockIntent.swift — is compiled into
        # both bundles, and it has to behave differently in each: the widget
        # needs the *name* of the Dismiss command so its button can refer to it,
        # while only the app has a timer for the command to act on. iOS always
        # runs a Live Activity's command in the app's process, so the widget's
        # copy is never executed; this flag is how that file says so.
        #
        # `$(inherited)` is load-bearing: without it this would replace the DEBUG
        # flag Xcode sets for debug builds rather than adding to it.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION

  ZenTomatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenTomatoTests
    dependencies:
      - target: ZenTomato
    settings:
      base:
        # The test bundle needs no Info.plist file on disk.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.martingleason.ZenTomato.tests
        # The tests run inside the app rather than on their own, so they
        # exercise the app's code in the same process and environment it
        # actually runs in — which for a database layer is the difference
        # between testing the thing and testing a copy of it.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ZenTomato.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZenTomato
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ZenTomato:
    build:
      targets:
        ZenTomato: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ZenTomatoTests
