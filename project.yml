# ZenTomato — XcodeGen project definition.
#
# THIS FILE IS THE PROJECT. `ZenTomato.xcodeproj` is generated from it by
# `make generate` and is git-ignored, so this YAML is the only reviewable
# description of how the app is built. Four reasons that trade is right here:
#
#   1. The brief mandates XcodeGen and forbids committing a binary project.
#   2. Two engineers share one working tree; a committed `.pbxproj` is a
#      guaranteed merge-corruption source.
#   3. The owner reviews every pull request and does not write Swift. A
#      `.pbxproj` diff is unreadable to anyone; this YAML is not.
#   4. CI regenerates from this file on every run, which proves this file
#      actually builds. A committed project proves nothing about this file.
#
# Cost: a fresh clone must run `make generate` before opening Xcode. That is
# one line in the README.

name: ZenTomato

options:
  bundleIdPrefix: com.martingleason
  deploymentTarget: { iOS: "26.0" }
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 6 language mode with the strictest data-race checking the compiler
    # offers. Turning this on now is cheap; turning it on after the timer
    # engine and audio callbacks exist would be a rewrite.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The lint gate is `swiftlint --strict`, not the compiler. A future SDK
    # deprecation warning must not be able to break the build gate.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    CODE_SIGN_STYLE: Automatic
    # Supplied by Config/App.xcconfig, overridden by the git-ignored
    # Config/Secrets.xcconfig. May legitimately be empty: simulator builds are
    # made with code signing disabled entirely, and only a device install needs
    # a team.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:

  ZenTomato:
    type: application
    platform: iOS
    # A DIRECTORY GLOB, never a per-file list. Adding a Swift file must not
    # require editing this file, or the two would drift.
    sources:
      - path: ZenTomato
    # Xcode's own configuration mechanism, and the only one this project uses.
    # App.xcconfig is committed and holds safe defaults; it ends by optionally
    # including the git-ignored Config/Secrets.xcconfig, which is where a real
    # credential lives. See Config/App.xcconfig for how a value reaches the app.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      # Also generated and git-ignored, so the Info.plist keys below are
      # reviewed as YAML here rather than as XML in a second file. It lives in
      # Support/, deliberately OUTSIDE the ZenTomato/ source glob, so XcodeGen
      # cannot mistake it for a bundled resource.
      path: Support/ZenTomato-Info.plist
      properties:
        CFBundleDisplayName: ZenTomato
        # These two must be written here, referring to the build settings
        # below, or they do not reach the app at all. XcodeGen fills an
        # unlisted key with its own default — which for the version is the
        # literal string "1.0" — so setting MARKETING_VERSION alone left the
        # app reporting itself as version 1.0 while this file said 0.1.0. That
        # is exactly the drift the "one reviewable source of truth" argument at
        # the top of this file exists to prevent, and version numbers stop
        # being cosmetic the moment two builds are installed on one phone.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without a launch-screen declaration the app letterboxes on a modern
        # iPhone, so this key must be present.
        #
        # It names the colour of the blank screen iOS shows between the tap on
        # the icon and the app's first frame. Left empty that screen is pure
        # white (or pure black), which flashes
        # against this app's warm stone page on every single launch. Naming a
        # colour here makes the launch screen the same colour as the page, so
        # there is nothing to see.
        #
        # LaunchBackground must stay equal to ColorRole.surfacePrimary. Nothing in
        # the compiler can enforce that — an asset catalog is data, not code — so
        # a test decodes this colour set and compares it against the role. If you
        # change one, that test tells you to change the other.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait only. This is one glanceable single-column screen; shipping
        # landscape would ship a layout nobody designed or tested.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Avoids an export-compliance prompt every time a build is installed.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martingleason.ZenTomato
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 1 = iPhone. No iPad layout exists.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ZenTomatoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenTomatoTests
    dependencies:
      - target: ZenTomato
    settings:
      base:
        # The test bundle needs no Info.plist file on disk.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.martingleason.ZenTomato.tests
        # The tests run inside the app rather than on their own, so they
        # exercise the app's code in the same process and environment it
        # actually runs in — which for a database layer is the difference
        # between testing the thing and testing a copy of it.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ZenTomato.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZenTomato
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ZenTomato:
    build:
      targets:
        ZenTomato: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ZenTomatoTests
